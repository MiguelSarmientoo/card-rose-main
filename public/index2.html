<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Preparing your special message."
    >

    <title>✨ Preparing your message</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="page">

        <section
            class="card"
            aria-labelledby="message-title"
        >

            <!-- ========================================
                 HEADER
            ========================================= -->

            <div class="header">

                <span class="eyebrow">
                    SPECIAL MESSAGE
                </span>


                <h1 id="message-title">
                    Miguel has sent you a message
                </h1>

            </div>


            <!-- ========================================
                 PENGUIN
            ========================================= -->

            <div class="image-container">

                <img
                    src="penguin.svg"
                    alt="Penguin holding a message"
                    class="penguin"
                >

            </div>


            <!-- ========================================
                 LOADING
            ========================================= -->

            <div class="loading-content">

                <p id="loading-message">
                    Preparing something special... ✨
                </p>


                <div
                    class="progress-container"
                    role="progressbar"
                    aria-label="Preparing your message"
                >

                    <div class="progress-bar"></div>

                </div>


                <span class="loading-hint">
                    Just a little surprise for you... 💕
                </span>

            </div>

        </section>

    </main>


    <script src="script2.js"></script>

</body>

</html>
